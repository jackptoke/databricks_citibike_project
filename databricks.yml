# This is a Databricks asset bundle definition for tokedab_cicd_project.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: tokedab_cicd_project
  uuid: 284fa2f4-ca92-4531-b6be-a63bb1d84599

include:
  - resources/*.yml

# dev / test / prod share one serverless workspace (provisioned by infra/) and
# are separated by catalog (citibike_<target>) and bundle root path. test/prod
# live under the deployer's home folder, so always deploy them as the same identity.
workspace:
  host: https://adb-7405614049452326.6.azuredatabricks.net

# Variable declarations. These variables are assigned in the dev/test/prod targets below.
variables:
  source_volume_path:
    description: UC Volume path Auto Loader watches for new Citibike archives
  runner_sp:
    description: >-
      Service principal that test/prod jobs run as. It owns the tables in its
      catalog (infra/databricks grants it ALL_PRIVILEGES), so runs don't depend
      on who deployed.
    default: ""

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    variables:
      source_volume_path: /Volumes/citibike_dev/00_landing/source_data/citibike_trips/
    presets:
      artifacts_dynamic_version: true
  test:
    mode: production
    presets:
      name_prefix: '[test] '
    workspace:
      # Deployer's home folder: writable only by them (and admins).
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      source_volume_path: /Volumes/citibike_test/00_landing/source_data/citibike_trips/
      runner_sp:
        lookup:
          service_principal: citibike-test-deployer
    run_as:
      service_principal_name: ${var.runner_sp}
    permissions:
      # Grant CAN_MANAGE to whoever deploys (a person locally, or the CI service
      # principal) — avoids hardcoding a personal identity in a public repo.
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      # The run_as SP must read the notebooks in the deployer's home folder.
      - service_principal_name: ${var.runner_sp}
        level: CAN_VIEW
  prod:
    mode: production
    presets:
      name_prefix: '[prod] '
    workspace:
      # Deployer's home folder: writable only by them (and admins).
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      source_volume_path: /Volumes/citibike_prod/00_landing/source_data/citibike_trips/
      runner_sp:
        lookup:
          service_principal: citibike-prod-deployer
    run_as:
      service_principal_name: ${var.runner_sp}
    permissions:
      # Grant CAN_MANAGE to whoever deploys (a person locally, or the CI service
      # principal) — avoids hardcoding a personal identity in a public repo.
      - user_name: ${workspace.current_user.userName}
        level: CAN_MANAGE
      # The run_as SP must read the notebooks in the deployer's home folder.
      - service_principal_name: ${var.runner_sp}
        level: CAN_VIEW
